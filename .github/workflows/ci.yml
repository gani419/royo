name: ROYO Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        working-directory: backend
        run: go mod download

      - name: Run Go Unit & Integration Tests
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Build Go Server Binary
        working-directory: backend
        run: go build -v ./cmd/server

  frontend-ci:
    name: Turborepo Monorepo Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Go for browser integration server
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Workspace Typecheck
        run: pnpm turbo run typecheck

      - name: Build Web Application
        run: pnpm turbo run build

      - name: Verify shared CSS token generation
        run: pnpm theme:check

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser product, responsive and accessibility checks
        run: pnpm test

      - name: Verify Android JavaScript bundle
        run: pnpm --filter @royo/mobile exec expo export --platform android --output-dir dist-export

      - name: Verify iOS JavaScript bundle
        run: pnpm --filter @royo/mobile exec expo export --platform ios --output-dir dist-export-ios

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/

