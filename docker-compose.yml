services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: royo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-royo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-royo_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-royo_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./backend/migrations/000002_maintenance_and_video_persistence.up.sql:/docker-entrypoint-initdb.d/002_maintenance.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-royo_user} -d ${DB_NAME:-royo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: royo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      DATABASE_URL: postgres://${DB_USER:-royo_user}:${DB_PASSWORD:-royo_secure_password_2026}@postgres:5432/${DB_NAME:-royo_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,https://royo.tecdroid.com}
    depends_on:
      postgres:
        condition: service_healthy

  # React Web Application (Nginx)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: royo-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

